<script>
'use strict';
const $=id=>document.getElementById(id), F=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}),
  D=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',timeZone:'UTC'});
const num=(v,d=1)=>v==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d}).format(v);
const dateLabel=d=>D.format(new Date(d+'T00:00:00Z'));
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=JSON.parse($('payload').textContent), view='future', idx=0, current=null;
const sign=(v,d)=> (v>0?'+':'')+num(v,d);
function init(){const last=$('hotel').value; $('hotel').innerHTML=data.hotels.map(h=>'<option value="'+escape(h.id)+'">'+escape(h.name)+'</option>').join('');
if(data.hotels.some(h=>h.id===last))$('hotel').value=last; paint();}
const grid=(header,rows,chosen=()=>false)=>'<div class="scroller"><table><thead><tr>'+header.map(x=>'<th>'+escape(x)+'</th>').join('')+
  '</tr></thead><tbody>'+rows.map((r,i)=>'<tr class="'+(chosen(i)?'win':'')+'">'+r.map(x=>'<td>'+escape(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function plot(rows, series, opt){
  const {W,H,L,T,R,B} = {W:760,H:286,L:62,T:19,R:25,B:34}, {digits,selected,start,unit}=opt;
  const values=rows.flatMap(r=>series.map(s=>r[s.key])).filter(Number.isFinite);
  const low=Math.min(...values), high=Math.max(...values), pad=Math.max((high-low)*.12,1);
  const lo=Math.max(0,low-pad), hi=Math.min(unit==='%'?100:Infinity,high+pad), X=i=>L+i*(W-L-R)/Math.max(1,rows.length-1), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let html='';
  if(start!=null)html+='<rect x="'+(X(start)-(X(1)-X(0))/2)+'" y="'+T+'" width="'+(W-R-X(start)+(X(1)-X(0))/2)+'" height="'+(H-T-B)+'" rx="4" fill="#e8f5eb"/>';
  for(let k=0;k<5;k++){let v=lo+(hi-lo)*k/4,y=Y(v);html+='<path d="M '+L+' '+y+' H '+(W-R)+'" stroke="#e0e9e4"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+escape(num(v,digits))+'</text>';}
  for(let k=0;k<=5;k++){let i=Math.round(k*(rows.length-1)/5);html+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+escape(dateLabel(rows[i].date))+'</text>';}
  if(selected!=null)html+='<path d="M '+X(selected)+' '+T+' V '+(H-B)+'" stroke="#7b9c91" stroke-dasharray="4 4"/>';
  for(const s of series){let path='',active=false;
    rows.forEach((r,i)=>{let v=r[s.key];if(!Number.isFinite(v)){active=false;return;}path+=(active?' L ':' M ')+X(i)+' '+Y(v);active=true;});
    html+='<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="'+s.width+'" '+(s.dash?'stroke-dasharray="6 5"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    if(selected!=null&&Number.isFinite(rows[selected][s.key]))html+='<circle cx="'+X(selected)+'" cy="'+Y(rows[selected][s.key])+'" r="4.5" fill="'+s.color+'" stroke="white" stroke-width="2"/>';
  }
  const first=start??0, dx=(X(1)-X(0))/2;
  for(let i=first;i<rows.length;i++)html+='<rect class="pick" data-i="'+(i-first)+'" x="'+(X(i)-dx)+'" y="'+T+'" width="'+(2*dx)+'" height="'+(H-T-B)+'" fill="#0d7e6b" opacity="0"><title>'+escape(dateLabel(rows[i].date)+' · '+num(rows[i].model,digits)+' '+unit)+'</title></rect>';
  return html;
}
function paint(){
  const h=$('hotel').value,t=$('target').value, isOcc=t==='occupancy', q=data.targets[t], d=isOcc?1:0, suffix=isOcc?'%':' ₽', unit=q.unit;
  const forecast=data.forecast[h], tests=data.backtest[h][t], all=view==='future'?forecast:tests;
  idx=Math.max(0,Math.min(idx,all.length-1)); const selected=all[idx];
  const display=v=>num(v,d)+suffix, error=v=>num(v,d)+' '+unit;
  $('asof').textContent='Дата расчёта · '+dateLabel(data.as_of)+' '+data.as_of.slice(0,4);
  $('mode').textContent=data.event_source==='event_html'?'Загрузка и цена на 14 дней. Учебные гостиницы и афиша смоделированы.':'Загрузка и цена на 14 дней. Гостиницы смоделированы, для будущих дат подключена афиша KudaGo. Режим экспериментальный.';
  const avg=forecast.reduce((a,r)=>a+r[t].value,0)/forecast.length, peak=forecast.reduce((a,b)=>a[t].value>b[t].value?a:b), saved=q.baseline.test.mae-q.winner.test.mae;
  $('metrics').innerHTML=[['Среднее за 14 дней',display(avg),'По прогнозу выбранной гостиницы'],['Пиковый день',display(peak[t].value),dateLabel(peak.date)],['Ошибка модели на тесте',error(q.winner.test.mae),'MAE по всем гостиницам']].map(v=>'<div class="metric"><span>'+v[0]+'</span><strong>'+v[1]+'</strong><small>'+v[2]+'</small></div>').join('');
  $('chartTitle').textContent=view==='future'?'План на ближайшие 14 дней':'Проверка на отложенном периоде';
  $('chartNote').textContent=view==='future'?'Последние 28 дней и новый прогноз. Нажмите на дату для объяснения.':'Факт и прогноз на датах, не участвовавших в подборе модели.';
  $('future').setAttribute('aria-pressed',view==='future');$('test').setAttribute('aria-pressed',view==='test');
  const past=data.history[h].slice(-28);
  const rows=view==='future'?[...past.map(r=>({date:r.date,fact:r[t]})),...forecast.map(r=>({date:r.date,model:r[t].value,baseline:r[t].baseline}))]:tests;
  $('mainChart').innerHTML=plot(rows,[{key:'fact',color:'#35566b',width:2},{key:'baseline',color:'#a46d2d',width:1.8,dash:true},{key:'model',color:'#0c8a77',width:3}],{digits:0,unit:suffix.trim(),start:view==='future'?past.length:null,selected:idx+(view==='future'?past.length:0)});
  $('day').max=all.length-1;$('day').value=idx;$('selectedDate').textContent=dateLabel(selected.date);$('day').setAttribute('aria-valuetext',dateLabel(selected.date));
  const loc=q.winner.label;
  if(view==='future'){
    const p=selected[t], ranked=data.features.map((name,i)=>[name,p.contributions[i]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    const vmax=Math.max(...ranked.map(v=>Math.abs(v[1])),.001);
    const driver=([name,v])=>'<div class="driver"><span>'+escape(name)+'</span><span class="track"><i style="width:'+100*Math.abs(v)/vmax+'%"></i></span><em>'+sign(v,d)+' '+unit+'</em></div>';
    const events=selected.events.length?'<ul>'+selected.events.map(e=>'<li>'+escape(e.title)+(e.venue?' · '+escape(e.venue):'')+'</li>').join('')+'</ul>':'<p>На дату расчёта анонсов в выбранном источнике нет.</p>';
    $('detail').innerHTML='<h2>'+escape(dateLabel(selected.date))+'</h2><div class="val">'+display(p.value)+'</div><div class="micro">'+escape(loc)+'</div><h3>Главные факторы прогноза</h3><p>Отсчёт модели: '+display(p.intercept)+'. Знак показывает направление вклада.</p>'+ranked.slice(0,4).map(driver).join('')+
      '<details style="margin-top:10px"><summary style="padding:6px 9px;font-size:12px">Все вклады</summary><div style="padding:0 9px 8px">'+ranked.map(driver).join('')+(Math.abs(p.clip)>1e-8?'<p>Ограничение диапазона: '+error(p.clip)+'</p>':'')+'</div></details><h3>Известные мероприятия</h3>'+events;
  }else $('detail').innerHTML='<h2>'+escape(dateLabel(selected.date))+'</h2><div class="val">'+display(selected.model)+'</div><div class="micro">Прогноз выпущен '+escape(dateLabel(selected.origin))+'</div><h3>Факт и ошибка</h3><p>Факт: <b>'+display(selected.fact)+'</b><br>Абсолютная ошибка: <b>'+error(Math.abs(selected.model-selected.fact))+'</b><br>Сезонный прогноз: '+display(selected.baseline)+'</p>';
  $('quality').innerHTML='<p>'+escape(loc)+' выбрана по MAE на валидации. На тесте '+(saved>=0?'ошибка ниже на ':'ошибка выше на ')+error(Math.abs(saved))+' относительно сезонного прогноза. Метрики показаны по всем гостиницам.</p>'+
    grid(['Модель','MAE валидация, '+unit,'MAE тест, '+unit,'RMSE тест, '+unit],q.finalists.map(r=>[r.label,num(r.validation.mae,2),num(r.test.mae,2),num(r.test.rmse,2)]),i=>q.finalists[i].family===q.winner.family)+
    '<p>MAE по горизонту: 1–7 дней — '+error(q.by_horizon['1–7'].mae)+'; 8–14 дней — '+error(q.by_horizon['8–14'].mae)+'. MAE той же модели без признаков афиши: '+error(q.without_events.mae)+'.</p>';
  const imp=q.importance.slice(0,8);
  $('importance').innerHTML='<p>Вклад признаков рассчитан на отложенной истории. Перемешивание показывает изменение MAE, если нарушить связь отдельного признака с остальными наблюдениями. Коррелирующие признаки интерпретируются осторожно.</p>'+
    grid(['Признак','Средний |вклад|','Прирост MAE','|Вклад| 1-я половина','|Вклад| 2-я половина'],imp.map(r=>[r.name,...['native','permutation','early','late'].map(k=>error(r[k]))]))+
    '<p>Частичная зависимость: средний прогноз при изменении близости площадок. Это отклик модели, а не причинный эффект.</p>'+
    grid(['Индекс близости','Средний прогноз'],q.pdp.map(r=>[num(r.value,2),display(r.prediction)]));
  $('logs').innerHTML='<p>Подбор по валидации. Любой запуск можно повторить через <code>python -m hotel.cli replay ID</code>.</p>'+
    grid(['ID','Модель','Настройки','MAE','RMSE'],q.candidates.map(r=>[r.id,r.label,JSON.stringify(r.params),num(r.validation.mae,2),num(r.validation.rmse,2)]),i=>q.candidates[i].id===q.winner.id)+
    '<p>Последние запуски загрузки</p>'+grid(['Источник','До даты','Статус','Новых порций','Строк','Флаги'],data.journal.map(r=>[r.source,r.through_day,r.status,r.added_slices,r.rows,r.flagged]));
  $('footer').textContent='Версия '+data.version+' · Данные '+data.data_hash.slice(0,12)+' · Тест по '+data.splits.test_end+' · '+data.splits.test_origins+' дат выпуска прогноза';
  current={h,t,all};
}
$('hotel').onchange=$('target').onchange=()=>{idx=0;paint();};
$('future').onclick=$('test').onclick=e=>{view=e.currentTarget.id;idx=0;paint();};
$('day').oninput=e=>{idx=Number(e.currentTarget.value);paint();};
$('mainChart').onclick=e=>{if(e.target.dataset.i!=null){idx=Number(e.target.dataset.i);paint();}};
$('download').onclick=()=>{const {h,t,all}=current;let csv='date;forecast;seasonal;actual\r\n';
  csv+=all.map(r=>[r.date, (view==='future'?r[t].value:r.model).toFixed(2),(view==='future'?r[t].baseline:r.baseline).toFixed(2),r.fact?.toFixed(2)??''].join(';')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=h+'-'+t+'-'+view+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};
init();
if(/^https?:$/.test(location.protocol))setInterval(async()=>{try{const r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)return;
  const n=await r.json();if(n.as_of!==data.as_of||n.data_hash!==data.data_hash||n.event_source!==data.event_source||n.journal[0]?.id!==data.journal[0]?.id){data=n;init();}}catch(_){}},15000);
</script>
